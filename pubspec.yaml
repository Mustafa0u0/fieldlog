name: fieldlog
description: Offline-first field inspections — record them anywhere, they reach the server when the signal does.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4

  # The queue this app is built around, from pub.dev rather than vendored in.
  # It stays a package with its own tests, and this line is the same one
  # anybody else would write.
  outbox_queue: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
